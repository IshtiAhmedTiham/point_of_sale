<div class="page-heading">
    <div>
        <span class="page-eyebrow">Operations</span>
        <h1>Update Supplier</h1>
        <p>Edit supplier details and keep your records current.</p>
    </div>

    <a class="btn btn-light" href="#/suplier">
        <i class="fas fa-arrow-left mr-1"></i> Back to list
    </a>
</div>

<div class="category-form-wrap">

    <div class="card">

        <div class="card-header">Supplier details</div>

        <div class="card-body">

            <form id="submitForm">

                <input type="hidden" id="suplierId">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter Supplier Name"
                        required>
                </div>

                <div class="form-group">
                    <label for="brand_name">Brand</label>
                    <select class="form-control" id="brand_name" name="brand_name" required>
                        <option value="">Select brand</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="Enter Supplier Phone"
                        required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" class="form-control" id="address" name="address"
                        placeholder="Enter Supplier Address" required>
                </div>

                <div class="form-group">
                    <label for="account_no">Account No</label>
                    <input type="text" class="form-control" id="account_no" name="account_no"
                        placeholder="Enter Account Number" required>
                </div>

                <div class="form-group">
                    <label for="opening_balance">Opening Balance</label>
                    <input type="number" step="0.01" class="form-control" id="opening_balance"
                        name="opening_balance" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="image">Image</label>
                    <input type="file" class="form-control-file" id="image" name="image" accept="image/*" required>
                    <img id="imagePreview" class="mt-2 border rounded" width="120" height="120"
                        style="object-fit:cover;" alt="Current image">
                    <small class="form-text text-muted">Select a new image to save this update.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Update supplier</button>
                <a class="btn btn-secondary btn-block mt-2" href="#/suplier">Cancel</a>

            </form>

        </div>

    </div>

</div>
