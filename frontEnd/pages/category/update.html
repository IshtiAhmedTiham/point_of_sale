<div class="page-heading">
    <div>
        <span class="page-eyebrow">Catalog</span>
        <h1>Update Category</h1>
        <p>Edit category details and keep your catalog current.</p>
    </div>

    <a class="btn btn-light" href="#/category">
        <i class="fas fa-arrow-left mr-1"></i> Back to list
    </a>
</div>

<div class="category-form-wrap">

    <div class="card">

        <div class="card-header">Category details</div>

        <div class="card-body">

            <form id="submitForm">

                <input type="hidden" id="categoryId">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter Category Name"
                        required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" class="form-control" id="category" name="category" placeholder="Enter Category ID"
                        required>
                </div>

                <div class="form-group">
                    <label for="code">Code</label>
                    <input type="text" class="form-control" id="code" name="code" placeholder="Enter Category Code"
                        required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" class="form-control" id="description" name="description"
                        placeholder="Enter Category Description" required>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select class="form-control" id="status" name="status">
                        <option value="Active" selected>Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="image">Image</label>
                    <input type="file" class="form-control-file" id="image" name="image" accept="image/*">
                    <img id="imagePreview" class="mt-2 border rounded" width="120" height="120"
                        style="object-fit:cover;" alt="Current image">
                    <small class="form-text text-muted">Leave empty to keep the current image.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Update category</button>
                <a class="btn btn-secondary btn-block mt-2" href="#/category">Cancel</a>

            </form>

            <p id="message" role="alert"></p>

        </div>

    </div>

</div>
