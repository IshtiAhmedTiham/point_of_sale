<div class="page-heading">
    <div>
        <span class="page-eyebrow">Catalog</span>
        <h1>Update Brand</h1>
        <p>Edit brand details and keep your catalog current.</p>
    </div>

    <a class="btn btn-light" href="#/brand">
        <i class="fas fa-arrow-left mr-1"></i> Back to list
    </a>
</div>

<div class="category-form-wrap">

    <div class="card">

        <div class="card-header">Brand details</div>

        <div class="card-body">

            <form id="submitForm">

                <input type="hidden" id="brandId">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter Brand Name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter Brand Email"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="Enter Brand Phone"
                        required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" class="form-control" id="address" name="address"
                        placeholder="Enter Brand Address" required>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select class="form-control" id="status" name="status">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="logo">Logo</label>
                    <input type="file" class="form-control-file" id="logo" name="logo" accept="image/*" required>
                    <img id="imagePreview" class="mt-2 border rounded" width="120" height="120"
                        style="object-fit:cover;" alt="Current logo">
                    <small class="form-text text-muted">Select a new logo to save this update.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Update brand</button>
                <a class="btn btn-secondary btn-block mt-2" href="#/brand">Cancel</a>

            </form>

        </div>

    </div>

</div>
