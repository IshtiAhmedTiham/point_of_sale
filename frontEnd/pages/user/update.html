<div class="page-heading">
    <div>
        <span class="page-eyebrow">People</span>
        <h1>Update User</h1>
        <p>Edit user details and keep access records current.</p>
    </div>

    <a class="btn btn-light" href="#/user">
        <i class="fas fa-arrow-left mr-1"></i> Back to list
    </a>
</div>

<div class="category-form-wrap">

    <div class="card">

        <div class="card-header">User details</div>

        <div class="card-body">

            <form id="submitForm">

                <input type="hidden" id="userId">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter User Name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter User Email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Enter New Password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                        placeholder="Confirm New Password" required>
                </div>

                <div class="form-group">
                    <label for="role">Role</label>
                    <input type="text" class="form-control" id="role" name="role" placeholder="Enter User Role"
                        required>
                </div>

                <div class="form-group">
                    <label for="branch">Branch</label>
                    <input type="text" class="form-control" id="branch" name="branch" placeholder="Enter User Branch"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="Enter User Phone"
                        required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" class="form-control" id="address" name="address"
                        placeholder="Enter User Address" required>
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select class="form-control" id="status" name="status">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="image">Image</label>
                    <input type="file" class="form-control-file" id="image" name="image" accept="image/*" required>
                    <img id="imagePreview" class="mt-2 border rounded" width="120" height="120"
                        style="object-fit:cover;" alt="Current image">
                    <small class="form-text text-muted">Select a new image and enter a new password to save this update.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Update user</button>
                <a class="btn btn-secondary btn-block mt-2" href="#/user">Cancel</a>

            </form>

        </div>

    </div>

</div>
