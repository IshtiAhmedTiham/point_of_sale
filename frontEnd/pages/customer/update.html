<div class="page-heading">
    <div>
        <span class="page-eyebrow">People</span>
        <h1>Update Customer</h1>
        <p>Edit customer details and keep your records current.</p>
    </div>

    <a class="btn btn-light" href="#/customer">
        <i class="fas fa-arrow-left mr-1"></i> Back to list
    </a>
</div>

<div class="category-form-wrap">

    <div class="card">

        <div class="card-header">Customer details</div>

        <div class="card-body">

            <form id="submitForm">

                <input type="hidden" id="customerId">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Enter Customer Name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter Customer Email"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone</label>
                    <input type="text" class="form-control" id="phone" name="phone" placeholder="Enter Customer Phone"
                        required>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" class="form-control" id="address" name="address"
                        placeholder="Enter Customer Address" required>
                </div>

                <div class="form-group">
                    <label for="account_no">Account No</label>
                    <input type="text" class="form-control" id="account_no" name="account_no"
                        placeholder="Enter Account Number" required>
                </div>

                <div class="form-group">
                    <label for="opening_balance">Opening Balance</label>
                    <input type="number" step="0.01" class="form-control" id="opening_balance"
                        name="opening_balance" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="discount">Discount</label>
                    <input type="number" step="0.01" class="form-control" id="discount" name="discount"
                        placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="taxable">Taxable</label>
                    <input type="number" step="0.01" class="form-control" id="taxable" name="taxable"
                        placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="icon">Image</label>
                    <input type="file" class="form-control-file" id="icon" name="icon" accept="image/*" required>
                    <img id="imagePreview" class="mt-2 border rounded" width="120" height="120"
                        style="object-fit:cover;" alt="Current image">
                    <small class="form-text text-muted">Select a new image to save this update.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Update customer</button>
                <a class="btn btn-secondary btn-block mt-2" href="#/customer">Cancel</a>

            </form>

        </div>

    </div>

</div>
